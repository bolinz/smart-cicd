---
# Log Tailer - tails logs from runner pods
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-tailer
  namespace: smart-cicd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-tailer
  template:
    metadata:
      labels:
        app: log-tailer
    spec:
      containers:
        - name: log-tailer
          image: log-tailer:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KUBERNETES_NAMESPACE
              value: "smart-cicd"
            - name: LABEL_KEY
              value: "run_id"
