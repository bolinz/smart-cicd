# Deployments for all smart-cicd services
# Each service runs as a separate Deployment

---
# Pod Watcher - watches Kubernetes pods for pipeline runs
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-watcher
  namespace: smart-cicd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-watcher
  template:
    metadata:
      labels:
        app: pod-watcher
    spec:
      containers:
        - name: pod-watcher
          image: pod-watcher:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KUBERNETES_NAMESPACE
              value: "smart-cicd"
            - name: LABEL_KEY
              value: "run_id"
          envFrom:
            - configMapRef:
                name: smart-cicd-config
---
