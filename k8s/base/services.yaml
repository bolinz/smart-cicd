# Internal cluster services for smart-cicd components
# These services allow components to communicate via DNS
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: smart-cicd
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: control-plane
---
apiVersion: v1
kind: Service
metadata:
  name: rule-engine
  namespace: smart-cicd
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: rule-engine
---
