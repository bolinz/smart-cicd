name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    # 只有存在 .changeset 文件时才发布
    if: contains(github.event.head_commit.message, 'changeset') || contains(github.event.head_commit.message, 'chore: version')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run release:version
          commit: 'chore: version packages'
          title: 'chore: version packages'
          label: 'autorelease'
          publish: npm run release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 监听已创建的 tag，发布 GitHub Release
  github_release:
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body: 'See CHANGELOG.md for details.'
          files: ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
