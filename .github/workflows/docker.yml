name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    strategy:
      matrix:
        service:
          - { name: pod-watcher, target: runtime-watcher-pod }
          - { name: job-watcher, target: runtime-watcher-job }
          - { name: event-watcher, target: runtime-watcher-event }
          - { name: log-tailer, target: runtime-watcher-log }
          - { name: rule-engine, target: runtime-rule-engine }
          - { name: control-plane, target: runtime-control-plane }
          - { name: action-engine, target: runtime-action-engine }
          - { name: ai-supervisor, target: runtime-ai-supervisor }
          - { name: ui, target: runtime-ui }
          - { name: api-server, target: runtime-api-server }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.service.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/smart-cicd/${{ matrix.service.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/smart-cicd/${{ matrix.service.name }}:branch-${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.service.name }}-${{ github.sha }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}-${{ github.sha }}
