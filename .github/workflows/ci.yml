name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npx tsc --noEmit
        name: typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npx vitest run
        name: test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: smart-cicd-e2e

      - name: Build, deploy, and run e2e tests
        run: |
          chmod +x scripts/local-e2e-startup.sh
          scripts/local-e2e-startup.sh --skip-colima
          npm run test:e2e

      - name: Cleanup
        if: always()
        run: scripts/local-e2e-cleanup.sh
