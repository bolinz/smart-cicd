name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npx tsc --noEmit
        name: typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npx vitest run
        name: test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: smart-cicd-e2e

      - name: Build and load api-server image
        run: |
          docker build --target runtime-api-server -t api-server:local .
          kind load docker-image api-server:local -n smart-cicd-e2e

      - name: Deploy api-server to kind
        run: |
          kubectl create namespace smart-cicd --dry-run=client -o yaml | kubectl apply -f -
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: smart-cicd-config
            namespace: smart-cicd
          data:
            KUBERNETES_NAMESPACE: "smart-cicd"
            NAMESPACE: "smart-cicd"
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: smart-cicd-runner
          rules:
            - apiGroups: ["batch"]
              resources: ["jobs"]
              verbs: ["create", "get", "list", "watch", "delete"]
            - apiGroups: [""]
              resources: ["pods", "pods/log", "events"]
              verbs: ["get", "list", "watch", "create", "delete"]
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: smart-cicd-runner
          subjects:
            - kind: ServiceAccount
              name: default
              namespace: smart-cicd
          roleRef:
            kind: ClusterRole
            name: smart-cicd-runner
            apiGroup: rbac.authorization.k8s.io
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: api-server
            namespace: smart-cicd
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: api-server
            template:
              metadata:
                labels:
                  app: api-server
              spec:
                serviceAccountName: default
                containers:
                  - name: api-server
                    image: api-server:local
                    imagePullPolicy: IfNotPresent
                    envFrom:
                      - configMapRef:
                          name: smart-cicd-config
                    env:
                      - name: SERVICE_PORT
                        value: "8080"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: api-server
            namespace: smart-cicd
          spec:
            selector:
              app: api-server
            ports:
              - port: 8080
                targetPort: 8080
          EOF
          kubectl wait --for=condition=Ready pods -n smart-cicd -l app=api-server --timeout=5m

      - name: Run e2e tests
        run: |
          kubectl port-forward -n smart-cicd svc/api-server 8080:8080 &
          sleep 5
          npm run test:e2e

      - name: Debug logs
        if: failure()
        run: |
          echo "=== Pods ==="
          kubectl get pods -n smart-cicd -o wide
          echo "=== Jobs ==="
          kubectl get jobs -n smart-cicd -o wide
          echo "=== api-server logs ==="
          kubectl logs -n smart-cicd -l app=api-server --tail=100
          echo "=== Runner pods ==="
          kubectl get pods -n smart-cicd --show-labels 2>/dev/null
          echo "=== Runner pod logs ==="
          kubectl logs -n smart-cicd -l run_id --tail=20 2>/dev/null || echo "(no runner pods)"
